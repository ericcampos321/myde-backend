# Nome do projeto explícito: isola containers/volumes de outros projetos (ex.: Rufus).
# Containers ficam como myde-backend-<service>-1; volumes como myde-backend_myde_*.
name: myde-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atendimento
    ports:
      - "5432:5432"
    volumes:
      - myde_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Externamente em 6380 para evitar conflito com Redis de outros projetos na 6379.
    # Internamente (rede Docker) o serviço continua na 6379: redis://redis:6379
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - myde_redis_data:/var/lib/redis/data

  # LEGADO/OPCIONAL — simulador da Meta para testes manuais offline.
  # Isolado atrás do profile "mock": NÃO sobe com `docker compose up -d` nem
  # com `docker compose up -d postgres redis`. O fluxo principal usa a Meta
  # WhatsApp Cloud API real (ambiente de teste).
  # Suba sob demanda apenas: `docker compose --profile mock up -d mock-meta`.
  mock-meta:
    profiles: ["mock"]
    build: ./mock-meta-server
    ports:
      - "8001:8001"
    environment:
      META_APP_SECRET: super-secret-app-secret-trocar
      CANDIDATE_WEBHOOK_URL: http://host.docker.internal:8000/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  myde_pg_data:
  myde_redis_data:
