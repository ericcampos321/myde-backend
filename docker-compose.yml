services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atendimento
    ports:
      - "5432:5432"
    volumes:
      - polls_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

    volumes:
      - polls_redis_data:/var/lib/redis/data

  mock-meta:
    build: ./mock-meta-server
    ports:
      - "8001:8001"
    environment:
      META_APP_SECRET: super-secret-app-secret-trocar
      CANDIDATE_WEBHOOK_URL: http://host.docker.internal:8000/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  polls_pg_data:
  polls_redis_data:
